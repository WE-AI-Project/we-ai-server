spring:
  jpa:
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      enabled: false

logging:
  level:
    root: warn
    com.weai.server: info
    org.springframework.security: warn
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: error

server:
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  web:
    base-url: ${APP_BASE_URL:https://api.example.com}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:https://we-ai-client.vercel.app}
    external-domains:
      api-domain: ${APP_API_DOMAIN:api.example.com}
      frontend-domain: ${APP_FRONTEND_DOMAIN:we-ai-client.vercel.app}
      storage-console-domain: ${APP_STORAGE_CONSOLE_DOMAIN:minio.example.com}
    cors:
      allowed-origins:
        - ${APP_FRONTEND_BASE_URL:https://we-ai-client.vercel.app}
        - ${APP_VITE_FRONTEND_BASE_URL:http://localhost:5183}
        - ${APP_ADDITIONAL_LOCAL_FRONTEND_BASE_URL:http://127.0.0.1:5183}
      # 와일드카드 패턴은 prod에서 기본으로 열어주지 않는다 — 실제 필요한 origin은 위
      # allowed-origins에 정확한 값으로 이미 등록되어 있다. 정말 패턴 매칭이 필요하면
      # 운영자가 아래 env var를 명시적으로 설정해야 한다 (예: 특정 프리뷰 서브도메인만).
      allowed-origin-patterns:
        - ${APP_LOCALHOST_FRONTEND_PATTERN:}
        - ${APP_LOCALHOST_LOOPBACK_PATTERN:}
        - ${APP_VERCEL_FRONTEND_PATTERN:}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Requested-With
        - X-Request-Id
      exposed-headers:
        - X-Request-Id
      allow-credentials: true
      max-age: 1h
