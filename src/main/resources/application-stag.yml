spring:
  jpa:
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      enabled: false

logging:
  level:
    root: info
    com.weai.server: info
    org.springframework.security: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: warn

server:
  forward-headers-strategy: framework

ai:
  chat:
    chroma:
      # See application-prod.yml for why this can't stay on the base localhost:8000 default.
      base-url: ${CHROMA_BASE_URL:http://chroma:8000}

storage:
  minio:
    # See application-prod.yml for why this can't stay on the base localhost:9000 default.
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  web:
    base-url: ${APP_BASE_URL:https://api-stag.example.com}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:https://we-ai-client.vercel.app}
    external-domains:
      api-domain: ${APP_API_DOMAIN:api-stag.example.com}
      frontend-domain: ${APP_FRONTEND_DOMAIN:we-ai-client.vercel.app}
      storage-console-domain: ${APP_STORAGE_CONSOLE_DOMAIN:minio-stag.example.com}
    cors:
      allowed-origins:
        - ${APP_FRONTEND_BASE_URL:https://we-ai-client.vercel.app}
        - ${APP_VITE_FRONTEND_BASE_URL:http://localhost:5183}
      # 와일드카드 패턴은 기본으로 열어주지 않는다 — 실제 필요한 origin은 위 allowed-origins에
      # 정확한 값으로 이미 등록되어 있다. 필요하면 운영자가 아래 env var를 명시적으로 설정한다.
      allowed-origin-patterns:
        - ${APP_LOCALHOST_FRONTEND_PATTERN:}
        - ${APP_LOCALHOST_LOOPBACK_PATTERN:}
        - ${APP_VERCEL_FRONTEND_PATTERN:}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Requested-With
        - X-Request-Id
      exposed-headers:
        - X-Request-Id
      allow-credentials: true
      max-age: 30m
